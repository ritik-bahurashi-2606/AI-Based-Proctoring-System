{% extends 'professor_dashboard.html' %}
{% block body %}
<div class="container-fluid">
  <h3 class="h3 mb-4 text-center">View Student Logs</h3>
  <div class="row mb-3">
    <div class="col-md-8 mb-2"><input id="logSearch" class="form-control" placeholder="Search exam ID, student name, email, student ID"></div>
    <div class="col-md-4 mb-2"><input id="logDate" type="date" class="form-control"></div>
  </div>
  <div class="table-responsive">
    <table class="table table-centered table-nowrap mb-0 rounded" id="studentLogsTable">
      <thead class="thead-light"><tr><th>Exam ID</th><th>Student ID</th><th>Name</th><th>Email</th><th>Last Log</th><th>Logs</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <h4 id="noLogs" class="text-center mt-4" style="display:none;">No Records Found!</h4>
</div>
<script>
let logTimer;
function renderLogs(rows) {
  const tbody = document.querySelector('#studentLogsTable tbody');
  document.getElementById('noLogs').style.display = rows.length ? 'none' : 'block';
  tbody.innerHTML = rows.map(r => `<tr><td>${r.test_id}</td><td>${r.student_id}</td><td>${r.student_name}</td><td>${r.email}</td><td>${r.last_log_time || ''}</td><td><a class="btn btn-sm btn-primary" href="/studentmonitoringstats/${r.test_id}/${r.email}">View</a></td></tr>`).join('');
}
function loadLogs() {
  const params = new URLSearchParams({search: logSearch.value, date: logDate.value});
  fetch(`/api/student-logs?${params}`).then(r => r.json()).then(data => { if (data.status === 'success') renderLogs(data.logs); });
}
['logSearch','logDate'].forEach(id => document.getElementById(id).addEventListener('input', () => { clearTimeout(logTimer); logTimer = setTimeout(loadLogs, 200); }));
loadLogs();
</script>
{% endblock %}

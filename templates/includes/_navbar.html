<script src="{{ url_for('static', filename='volt/vendor/sweetalert2/dist/sweetalert2.all.min.js') }}"></script>
<header class="header-global">
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand-custom" href="/">
        <div class="brand-icon">
          <i class="fas fa-shield-alt"></i>
        </div>
        <span>MYPROCTOR.AI</span>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fas fa-bars" style="color: #0B1035; font-size: 22px;"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link-custom" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link-custom" href="/#features">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link-custom" href="/#how-it-works">How It Works</a>
          </li>
          <li class="nav-item">
            <a class="nav-link-custom" href="/faq">About Us &amp; FAQ</a>
          </li>
          <li class="nav-item">
            <a class="nav-link-custom" href="/contact">Contact</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          {% if session.logged_in %}
            {% if session.user_role == "student" %}
              <a href="/student_index" class="btn btn-modern-secondary py-2 px-3">
                <i class="fas fa-columns mr-1"></i> Dashboard
              </a>
              <a href="/changepassword_student" class="nav-link-custom">
                <i class="fas fa-key mr-1"></i> Password
              </a>
            {% elif session.user_role == "teacher" %}
              <a href="/professor_index" class="btn btn-modern-secondary py-2 px-3">
                <i class="fas fa-columns mr-1"></i> Dashboard
              </a>
              <a href="/changepassword_professor" class="nav-link-custom">
                <i class="fas fa-key mr-1"></i> Password
              </a>
            {% endif %}
            <button onclick="return funLogout()" class="btn btn-modern-outline py-2 px-3 ml-2">
              <i class="fas fa-sign-out-alt mr-1"></i> Logout
            </button>
          {% else %}
            <a href="/login" class="nav-link-custom font-weight-600 mr-2">Login</a>
            <a href="/register" class="btn btn-modern-primary py-2 px-4">
              Get Started
            </a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
</header>

<script>
function funLogout() {
  swal.fire({
    title: 'Are you sure?',
    text: "Do you really want to logout?",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Yes, Logout!',
    cancelButtonText: 'Cancel',
    confirmButtonColor: '#4338CA',
    cancelButtonColor: '#64748B',
    reverseButtons: true
  }).then((result) => {
    if (result.isConfirmed) {
      $.ajax({
        type: "POST",
        url: "/logout",
        success: function(response){
          if(response == "success") {
            window.location.href = "/";
          }
        }
      });  
      swal.fire(
        'Signed Out',
        'You have successfully signed out.',
        'success'
      );
    }
  });
}
</script>

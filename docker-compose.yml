x-proctoring-worker: &proctoring-worker
  image: myproctor-app:local
  restart: unless-stopped
  command: ["celery", "-A", "proctoring_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "-Q", "proctoring-0"]
  environment:
    MYSQL_HOST: host.docker.internal
    MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the application .env file}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the application .env file}
    MYSQL_DB: ${MYSQL_DB:?Set MYSQL_DB in the application .env file}
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    CELERY_BROKER_URL: redis://redis:6379/0
    PROCTORING_WORKER_SHARDS: ${PROCTORING_WORKER_SHARDS:-2}
    PROCTORING_EVIDENCE_DIR: /app/proctoring_evidence
    PROCTOR_FACE_OUT_OF_FRAME_SECONDS: ${PROCTOR_FACE_OUT_OF_FRAME_SECONDS:-2}
    PROCTOR_ABSENT_SECONDS: ${PROCTOR_ABSENT_SECONDS:-2}
    PROCTOR_OBJECT_PERSIST_SECONDS: ${PROCTOR_OBJECT_PERSIST_SECONDS:-2}
    PROCTOR_OBJECT_TRACK_WINDOW_SECONDS: ${PROCTOR_OBJECT_TRACK_WINDOW_SECONDS:-15}
    PROCTOR_OBJECT_SAMPLE_CREDIT_SECONDS: ${PROCTOR_OBJECT_SAMPLE_CREDIT_SECONDS:-1}
    PROCTOR_OBJECT_MISS_GRACE_SECONDS: ${PROCTOR_OBJECT_MISS_GRACE_SECONDS:-5}
    PROCTOR_MULTIPLE_PERSONS_SECONDS: ${PROCTOR_MULTIPLE_PERSONS_SECONDS:-2}
    PROCTOR_HEAD_YAW_THRESHOLD: ${PROCTOR_HEAD_YAW_THRESHOLD:-50}
    PROCTOR_HEAD_PITCH_THRESHOLD: ${PROCTOR_HEAD_PITCH_THRESHOLD:-50}
    PROCTOR_HEAD_ROLL_THRESHOLD: ${PROCTOR_HEAD_ROLL_THRESHOLD:-50}
    PROCTOR_HEAD_TURN_SECONDS: ${PROCTOR_HEAD_TURN_SECONDS:-2}
    PROCTOR_RESTRICTED_DEVICE_LABELS: ${PROCTOR_RESTRICTED_DEVICE_LABELS:-tvmonitor,laptop,mouse,remote,keyboard,microwave,oven,toaster,refrigerator}
    YOLO_PHONE_SCORE_MIN: ${YOLO_PHONE_SCORE_MIN:-0.25}
    YOLO_DEVICE_SCORE_MIN: ${YOLO_DEVICE_SCORE_MIN:-0.30}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./audio_evidence:/app/audio_evidence
    - ./proctoring_evidence:/app/proctoring_evidence

services:
  web:
    image: myproctor-app:local
    build: .
    container_name: myproctor_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the application .env file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the application .env file}
      MYSQL_DB: ${MYSQL_DB:?Set MYSQL_DB in the application .env file}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MAIL_SERVER: ${MAIL_SERVER:?Set MAIL_SERVER in the application .env file}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in the application .env file}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in the application .env file}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-False}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:?Set MAIL_DEFAULT_SENDER in the application .env file}
      CELERY_BROKER_URL: redis://redis:6379/0
      PROCTORING_ASYNC: ${PROCTORING_ASYNC:-true}
      PROCTORING_WORKER_SHARDS: ${PROCTORING_WORKER_SHARDS:-2}
      PROCTORING_MAX_PENDING: ${PROCTORING_MAX_PENDING:-120}
      PROCTORING_RESERVATION_LEASE_SECONDS: ${PROCTORING_RESERVATION_LEASE_SECONDS:-1800}
      PROCTORING_EVIDENCE_DIR: /app/proctoring_evidence
      PROCTOR_FACE_OUT_OF_FRAME_SECONDS: ${PROCTOR_FACE_OUT_OF_FRAME_SECONDS:-2}
      PROCTOR_ABSENT_SECONDS: ${PROCTOR_ABSENT_SECONDS:-2}
      PROCTOR_OBJECT_PERSIST_SECONDS: ${PROCTOR_OBJECT_PERSIST_SECONDS:-2}
      PROCTOR_OBJECT_TRACK_WINDOW_SECONDS: ${PROCTOR_OBJECT_TRACK_WINDOW_SECONDS:-15}
      PROCTOR_OBJECT_SAMPLE_CREDIT_SECONDS: ${PROCTOR_OBJECT_SAMPLE_CREDIT_SECONDS:-1}
      PROCTOR_OBJECT_MISS_GRACE_SECONDS: ${PROCTOR_OBJECT_MISS_GRACE_SECONDS:-5}
      PROCTOR_MULTIPLE_PERSONS_SECONDS: ${PROCTOR_MULTIPLE_PERSONS_SECONDS:-2}
      PROCTOR_HEAD_YAW_THRESHOLD: ${PROCTOR_HEAD_YAW_THRESHOLD:-50}
      PROCTOR_HEAD_PITCH_THRESHOLD: ${PROCTOR_HEAD_PITCH_THRESHOLD:-50}
      PROCTOR_HEAD_ROLL_THRESHOLD: ${PROCTOR_HEAD_ROLL_THRESHOLD:-50}
      PROCTOR_HEAD_TURN_SECONDS: ${PROCTOR_HEAD_TURN_SECONDS:-2}
      PROCTOR_RESTRICTED_DEVICE_LABELS: ${PROCTOR_RESTRICTED_DEVICE_LABELS:-tvmonitor,laptop,mouse,remote,keyboard,microwave,oven,toaster,refrigerator}
      YOLO_PHONE_SCORE_MIN: ${YOLO_PHONE_SCORE_MIN:-0.25}
      YOLO_DEVICE_SCORE_MIN: ${YOLO_DEVICE_SCORE_MIN:-0.30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./registration_tokens:/app/registration_tokens
      - ./audio_evidence:/app/audio_evidence
      - ./proctoring_evidence:/app/proctoring_evidence

  proctoring_worker_0:
    <<: *proctoring-worker
    container_name: myproctor_proctoring_worker_0

  proctoring_worker_1:
    <<: *proctoring-worker
    container_name: myproctor_proctoring_worker_1
    command: ["celery", "-A", "proctoring_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "-Q", "proctoring-1"]

  proctoring_worker_2:
    <<: *proctoring-worker
    container_name: myproctor_proctoring_worker_2
    command: ["celery", "-A", "proctoring_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "-Q", "proctoring-2"]
    profiles: ["proctoring-scale"]

  proctoring_worker_3:
    <<: *proctoring-worker
    container_name: myproctor_proctoring_worker_3
    command: ["celery", "-A", "proctoring_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "-Q", "proctoring-3"]
    profiles: ["proctoring-scale"]

  redis:
    image: redis:7-alpine
    container_name: myproctor_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - proctoring_data:/data

  db:
    image: mysql:8.0
    container_name: myproctor_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-ritik}
      MYSQL_DATABASE: myproctor
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./DB/quizappstructure.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  proctoring_data:

{% extends 'professor_dashboard.html' %}
{% block body %}
<div class="container-fluid">
  <h3 class="h3 mb-4 text-center">Student Results</h3>
  <div class="row mb-3">
    <div class="col-md-4 mb-2"><input id="resultSearch" class="form-control" placeholder="Search exam, student, email, subject, topic"></div>
    <div class="col-md-2 mb-2"><input id="resultDate" type="date" class="form-control"></div>
    <div class="col-md-2 mb-2"><select id="riskFilter" class="form-control"><option value="">All Risks</option><option>Safe</option><option>Moderate</option><option>High Risk</option></select></div>
    <div class="col-md-2 mb-2"><select id="statusFilter" class="form-control"><option value="">Pass/Fail</option><option>Pass</option><option>Fail</option></select></div>
    <div class="col-md-2 mb-2"><select id="sortBy" class="form-control"><option value="submission_time">Submission Time</option><option value="marks">Marks</option></select></div>
  </div>
  <div class="table-responsive">
    <table class="table table-centered table-nowrap mb-0 rounded" id="profResultsTable">
      <thead class="thead-light"><tr><th>Exam ID</th><th>Student ID</th><th>Name</th><th>Email</th><th>Subject</th><th>Topic</th><th>Marks</th><th>Percentage</th><th>Pass/Fail</th><th>Submission Time</th><th>Risk Score</th><th>Risk Level</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <h4 id="noResults" class="text-center mt-4" style="display:none;">No Records Found!</h4>
</div>
<script>
let resultTimer;
function renderProfessorResults(rows) {
  const tbody = document.querySelector('#profResultsTable tbody');
  document.getElementById('noResults').style.display = rows.length ? 'none' : 'block';
  tbody.innerHTML = rows.map(r => `<tr><td>${r.exam_id}</td><td>${r.student_id}</td><td>${r.student_name}</td><td>${r.student_email}</td><td>${r.subject}</td><td>${r.topic}</td><td>${r.marks}</td><td>${r.percentage}%</td><td>${r.result_status}</td><td>${r.submission_time}</td><td>${r.cheating_risk_score}</td><td>${r.risk_level}</td></tr>`).join('');
}
function loadProfessorResults() {
  const params = new URLSearchParams({search: resultSearch.value, date: resultDate.value, risk_level: riskFilter.value, result_status: statusFilter.value, sort_by: sortBy.value});
  fetch(`/api/professor-results?${params}`).then(r => r.json()).then(data => { if (data.status === 'success') renderProfessorResults(data.results); });
}
['resultSearch','resultDate','riskFilter','statusFilter','sortBy'].forEach(id => document.getElementById(id).addEventListener('input', () => { clearTimeout(resultTimer); resultTimer = setTimeout(loadProfessorResults, 200); }));
loadProfessorResults();
</script>
{% endblock %}

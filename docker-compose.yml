version: "3.9"

services:
  web:
    build: .
    container_name: myproctor_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ritik}
      MYSQL_DB: myproctor
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./registration_tokens:/app/registration_tokens

  db:
    image: mysql:8.0
    container_name: myproctor_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-ritik}
      MYSQL_DATABASE: myproctor
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./DB/quizappstructure.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
